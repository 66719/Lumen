<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Cinema</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- SCREEN 1: Home Page -->
    <section id="home-page">
        <header class="header">
            <h1 class="logo">LUMEN</h1>
        </header>
        
        <main class="container">
            <!-- Dates Block -->
            <div class="dates-container" id="dates-container">
                <!-- Date buttons will be generated by JS -->
            </div>

            <!-- Movies List -->
            <div class="movies-grid" id="movies-grid">
                <!-- Movie cards will be generated by JS -->
            </div>
        </main>
    </section>

    <!-- SCREEN 2: Booking Page (Hidden by default) -->
    <section id="booking-page" class="hidden">
        <header class="header">
            <button id="back-btn" class="back-btn">← Back</button>
            <h1 class="logo">LUMEN</h1>
        </header>
        
        <main class="container">
            <!-- Movie Info -->
            <div class="movie-info" id="movie-info">
                <!-- Movie details will be injected here -->
            </div>

            <!-- Times Block -->
            <div class="times-container" id="times-container">
                <!-- Time buttons -->
            </div>

            <!-- Cinema Hall -->
            <div class="cinema-hall">
                <div class="screen">SCREEN</div>
                <div class="seats-container" id="seats-container">
                    <!-- Seats grid will be generated by JS -->
                </div>
            </div>

            <!-- Summary Panel -->
            <div class="summary-panel">
                <p>Selected seats: <span id="count">0</span></p>
                <p>Total amount: $<span id="total">0</span></p>
                <button id="buy-btn" class="buy-btn" disabled>Book Tickets</button>
            </div>
        </main>
    </section>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
